<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cuaca</title>

    <!-- SB Admin 2 CSS (CDN) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="p-4">

                <h1 class="h3 mb-4 text-gray-800">Data Sensor Cuaca Kota Cerdas</h1>

                <div class="card shadow mb-4">
                    <div class="card-body">
                        <p id="cuaca" class="mb-0">Memuat data...</p>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- SB Admin 2 JS (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/js/sb-admin-2.min.js"></script>

    <!-- SCRIPT CUACA -->
    <script>

        const apiKey = '9dba9fc8736cb2e244a23e98b7b126a0'; 
        const city = 'Bandung';

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
            .then(response => response.json())
            .then(data => {

                const suhu = data.main.temp;
                const kelembapan = data.main.humidity;

                document.getElementById("cuaca").innerText =
                    `Suhu: ${suhu}°C, Kelembapan: ${kelembapan}%`;

            })
            .catch(error => {
                document.getElementById("cuaca").innerText = "Gagal mengambil data.";
            });

    </script>

</body>

</html>
